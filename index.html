<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IG DMs Only</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
</head>
<body>
  <div id="app">
    <div class="loading">Loading your DMs…</div>
  </div>

  <script>
    // === Lock to Instagram DMs and disable back to main page ===
    (function lockToInbox() {
      const inboxPath = "/direct/inbox/";
      const base = "https://www.instagram.com";

      function ensureInbox() {
        if (!window.location.href.startsWith(base)) {
          window.location.replace(base + inboxPath);
          return;
        }

        // Allow reel pages (so you can view a single reel from DMs)
        const isReel =
          window.location.pathname.startsWith("/reel/") ||
          window.location.pathname.startsWith("/reels");

        if (!window.location.pathname.startsWith("/direct/") && !isReel) {
          // Not in DMs and not a reel → force to inbox
          window.location.replace(base + inboxPath);
          return;
        }

        // If in DMs, ensure we are exactly on /direct/inbox/
        if (window.location.pathname.startsWith("/direct/") && window.location.pathname !== inboxPath) {
          window.location.replace(base + inboxPath);
          return;
        }

        // Constantly push state to disable back button when in inbox
        if (window.location.pathname === inboxPath) {
          history.pushState({ page: "inbox" }, "", base + inboxPath);
        }
      }

      // Initial check
      ensureInbox();

      // Re-check frequently and on navigation events
      setInterval(ensureInbox, 600);

      window.addEventListener("popstate", ensureInbox);
      window.addEventListener("hashchange", ensureInbox);

      // Also intercept any link clicks that might navigate away
      document.addEventListener(
        "click",
        (e) => {
          const a = e.target.closest("a");
          if (!a) return;

          const href = a.getAttribute("href");
          if (!href) return;

          // Allow relative DMs links and reel links; block anything that goes to feed/explore
          if (
            href.startsWith("/") &&
            !href.startsWith("/direct/") &&
            !href.startsWith("/reel/") &&
            !href.startsWith("/reels")
          ) {
            e.preventDefault();
            e.stopPropagation();
            ensureInbox();
          }
        },
        true
      );
    })();

    // === Inject anti-doomscroll + nav-hiding code ===
    (function injectIgMods() {
      const css = `
        /* ---- Hide ALL bottom nav bars and tabs (Home, Search, Reels, etc.) ---- */
        nav[role="navigation"],
        footer[role="contentinfo"],
        div[role="tablist"],
        div[role="menubar"],
        header[role="banner"],
        div.x1n2onr6.x1g763f0,
        div.x1n2onr6.x1lkfr7t,
        div.x1n2onr6.x1j63zf2,
        div.x1n2onr6.x1g393a3,
        div.x1n2onr6.x1g843a3,
        div.x1n2onr6.x1fqp7bg,
        div.x1n2onr6.x1c4vz4f,
        section.x1n2onr6,
        div.x1n2onr6:has(a[href="/"]),
        div.x1n2onr6:has(a[href="/explore/"]),
        div.x1n2onr6:has(a[href*="/reels"]),
        div:has(> div > a[href="/"]),
        div:has(> div > a[href="/explore/"]),
        div:has(> div > a[href*="/reels"]) {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
          pointer-events: none !important;
        }

        /* Hide common nav link patterns */
        a[href="/"],
        a[href="/explore/"],
        a[href="/reels/"],
        a[href="/reels"],
        a[href*="/reels"],
        a[aria-label="Reels"],
        a[aria-label="Home"],
        a[aria-label="Explore"],
        a[aria-label="Messages"],
        a[aria-label="Notifications"],
        a[aria-label="Create"],
        a[aria-label="Profile"] {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
          pointer-events: none !important;
        }

        /* Aggressive class list for nav containers (web) */
        ._aigs,
        ._aigt,
        ._aa63,
        ._ab80,
        ._ab81,

        ._ab83,

        ._ab-a,

        ._ab-r,

        ._ab-t,

        ._ab-0,
        ._ab-1,

        ._ab-5,

        ._ab-e0,

        ._ab-k0,

        ._ab-m0,
        ._ab-n0,
        ._ab-o0,
        ._ab-p0,
        ._ab-q0,
        ._ab-r0,
        ._ab-s0,
        ._ab-t0,
        ._ab-u0,
        ._ab-v0,
        ._ab-w0,
        ._ab-x0,
        ._ab-y0,
        ._ab-z0 {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
          pointer-events: none !important;
        }

        /* ---- One-Reel, no doomscroll styles ---- */
        /* Hide "Up next" / suggestions / side rails on reels pages */
        div[aria-label="Up next"],
        div[aria-label="Suggested for you"],
        div[aria-label="Related reels"],
        div[aria-label="More like this"],
        section[aria-label="Reels"],
        div[role="feed"],
        div[role="list"],
        div[role="listbox"] {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
          pointer-events: none !important;
        }

        /* Disable scroll on main containers when on a reel page */
        html.reel-page,
        body.reel-page,
        #react-root.reel-page,
        main.reel-page,
        section[role="main"].reel-page,
        div[role="dialog"].reel-page,
        div[role="feed"].reel-page,
        div[role="list"].reel-page,
        div[role="listbox"].reel-page {
          overflow: hidden !important;
          overscroll-behavior: none !important;
          height: 100% !important;
        }
      `;

      const style = document.createElement("style");
      style.textContent = css;
      if (!document.head) {
        const head = document.createElement("head");
        document.documentElement.insertBefore(head, document.body);
      }
      document.head.appendChild(style);

      // Mark page as reel-page when on /reel or /reels
      function markReelPage() {
        const isReel =
          location.pathname.startsWith("/reel/") || location.pathname.startsWith("/reels");
        document.documentElement.classList.toggle("reel-page", isReel);
        document.body.classList.toggle("reel-page", isReel);
        const root = document.getElementById("react-root");
        if (root) root.classList.toggle("reel-page", isReel);
      }

      markReelPage();
      window.addEventListener("popstate", markReelPage);
      window.addEventListener("hashchange", markReelPage);

      // Disable scroll and touchmove on reel pages
      function blockScrollOnReel(e) {
        if (
          location.pathname.startsWith("/reel/") ||
          location.pathname.startsWith("/reels")
        ) {
          e.preventDefault();
        }
      }

      window.addEventListener("wheel", blockScrollOnReel, { passive: false });
      window.addEventListener("touchmove", blockScrollOnReel, { passive: false });

      // Override scrollIntoView to block auto-scroll loading more reels
      const origScrollIntoView = Element.prototype.scrollIntoView;
      Element.prototype.scrollIntoView = function (...args) {
        if (
          location.pathname.startsWith("/reel/") ||
          location.pathname.startsWith("/reels")
        ) {
          return;
        }
        return origScrollIntoView.apply(this, args);
      };

      // Observe DOM changes and keep killing scroll / side rails / nav
      const observer = new MutationObserver(() => {
        const isReel =
          location.pathname.startsWith("/reel/") ||
          location.pathname.startsWith("/reels");

        markReelPage();

        // Re-apply nav hiding in case Instagram re-injects elements
        document.querySelectorAll(
          'nav[role="navigation"], footer[role="contentinfo"], div[role="tablist"], div[role="menubar"], header[role="banner"]'
        ).forEach((el) => {
          el.style.display = "none";
          el.style.visibility = "hidden";
          el.style.opacity = "0";
          el.style.pointerEvents = "none";
        });

        // Hide reels suggestions and feeds
        document.querySelectorAll(
          'div[aria-label="Up next"], div[aria-label="Suggested for you"], div[aria-label="Related reels"], div[aria-label="More like this"], section[aria-label="Reels"], div[role="feed"], div[role="list"], div[role="listbox"]'
        ).forEach((el) => {
          el.style.display = "none";
          el.style.visibility = "hidden";
          el.style.opacity = "0";
          el.style.pointerEvents = "none";
        });

        if (isReel) {
          document.querySelectorAll(
            'html, body, #react-root, main, section[role="main"], div[role="dialog"], div[role="feed"], div[role="list"], div[role="listbox"]'
          ).forEach((el) => {
            el.style.overflow = "hidden";
            el.style.overscrollBehavior = "none";
          });
        }
      });

      observer.observe(document.documentElement, {
        childList: true,
        subtree: true,
      });

      // Initial pass after a short delay to catch late-loaded elements
      setTimeout(() => {
        markReelPage();
        observer.takeRecords();
      }, 800);
    })();
  </script>
</body>
</html>
